[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#1E2330"
borderColor = "#E4E7EC"
linkColor = "#4F46E5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "8px"
showWidgetBorder = true
chartCategoricalColors = ["#4F46E5", "#475569", "#94A3B8", "#DC2626"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
